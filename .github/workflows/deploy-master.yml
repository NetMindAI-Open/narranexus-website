name: Deploy master to narra.nexus

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 via SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/deploy_key ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            set -e
            export GIT_SSH_COMMAND="ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no"

            echo "=== Pulling latest master branch ==="
            cd /home/ubuntu/.narranexus_website/narranexus-website
            git fetch origin master
            git checkout master
            git pull origin master

            echo "=== Rebuilding and redeploying prod (narra.nexus) ==="
            cd /home/ubuntu/NetMind_RS_XYZ/NarraNexus-deploy/stacks/narranexus-website
            docker compose up -d --build

            echo "=== Done ==="
            docker ps --filter name=narranexus-website --format 'Status: {{.Status}}'
          EOF
