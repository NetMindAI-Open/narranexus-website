name: Deploy Dev to website.narra.nexus

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            echo "=== Pulling latest dev branch ==="
            cd /home/ubuntu/.narranexus_website/narranexus-website
            git fetch origin dev
            git checkout dev
            git pull origin dev

            echo "=== Rebuilding and redeploying website ==="
            cd /home/ubuntu/NetMind_RS_XYZ/NarraNexus-deploy/stacks/narranexus-website
            docker compose up -d --build

            echo "=== Deployment complete ==="
            docker ps --filter name=narranexus-website --format 'Status: {{.Status}}'
