name: Deploy Dev to website.narra.nexus

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 via SSH
        run: |
          # Decode and setup SSH key
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Add host to known_hosts to avoid prompt
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

          # Execute deployment commands
          ssh -i ~/.ssh/deploy_key ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            set -e
            echo "=== Pulling latest dev branch ==="
            cd /home/ubuntu/.narranexus_website/narranexus-website
            git fetch origin dev
            git checkout dev
            git pull origin dev

            echo "=== Rebuilding and redeploying website ==="
            cd /home/ubuntu/NetMind_RS_XYZ/NarraNexus-deploy/stacks/narranexus-website
            docker compose up -d --build

            echo "=== Deployment complete ==="
            docker ps --filter name=narranexus-website --format 'Status: {{.Status}}'
          EOF
